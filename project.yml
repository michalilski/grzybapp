name: Grzyby
options:
  bundleIdPrefix: com.michalilski
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
packages:
  GrzybEngine:
    path: Engine
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  Grzyby:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GrzybEngine
        product: GrzybEngine
      - package: GrzybEngine
        product: GrzybData
      - package: GrzybEngine
        product: GrzybStore
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michalilski.grzybapp
        PRODUCT_NAME: Grzyby
        DEVELOPMENT_TEAM: N5H5R9A2K2
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  Grzyby:
    build:
      targets:
        Grzyby: all
    run:
      config: Debug
    archive:
      config: Release
